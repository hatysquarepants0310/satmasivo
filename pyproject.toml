[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satmasivo"
version = "1.4.3"
description = "Descarga masiva de CFDI del SAT para Ubuntu"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "hatysquarepants0310" }]
dependencies = [
  "lxml>=5.0",
  "cryptography>=41.0",
  "requests>=2.31",
  "openpyxl>=3.1",
  "reportlab>=4.0",
]

[project.scripts]
satmasivo = "satmasivo.__main__:main"

[tool.setuptools.packages.find]
include = ["satmasivo*"]

[tool.setuptools.package-data]
satmasivo = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
