name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-lxml python3-cryptography python3-requests python3-openpyxl python3-reportlab python3-pil python3-tk
      - name: Tests
        run: PYTHONPATH=. python3 -m pytest -q

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build deb
        run: |
          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-ci"; fi
          bash packaging/build-deb.sh "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: satmasivo-deb
          path: dist/*.deb

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        run: |
          python -m pip install -U pip pyinstaller pillow openpyxl reportlab lxml cryptography requests
          python -m pip install -e .
          pyinstaller --noconfirm packaging/satmasivo.spec
          mkdir dist-win
          copy dist\satmasivo.exe dist-win\satmasivo.exe
      - uses: actions/upload-artifact@v4
        with:
          name: satmasivo-exe
          path: dist-win/satmasivo.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deb, exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: satmasivo-deb
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: satmasivo-exe
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
