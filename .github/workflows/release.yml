name: Release .deb

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip python3-gi python3-lxml python3-cryptography python3-requests dpkg-dev
      - name: Tests
        run: |
          sudo apt-get install -y python3-openpyxl python3-reportlab python3-pil python3-pytest || python3 -m pip install --user pytest openpyxl reportlab lxml cryptography requests
          PYTHONPATH=. python3 -m pytest -q
      - name: Build deb
        run: |
          mkdir -p dist
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-ci"; fi
          bash packaging/build-deb.sh "$VER"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: satmasivo-deb
          path: dist/*.deb
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes
          fi
